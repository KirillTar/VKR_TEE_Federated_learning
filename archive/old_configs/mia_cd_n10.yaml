# MIA experiment on CD scenario: N=10, q=1.0, E=10, Fashion-MNIST + MicroMNIST.
# Mirror of cross_silo/mia_n10.yaml. Reduced N amplifies per-client membership
# signal (fewer clients, more local epochs → higher risk of memorization).
name: mia_cd_n10
dataset: fashion_mnist
model_name: micro
data_dir: ./data
alpha: 0.5

n_clients: 10
clients_per_round: 10
n_rounds: 100
local_epochs: 10
batch_size: 32
lr: 0.01
momentum: 0.9
weight_decay: 1.0e-4

aggregation: fedavg
fedrola_chi: 0.1
m_assumed: 12
f: 28

use_dp: false
dp_level: client
epsilon: 10.0
delta: 1.0e-5
clip_max: 2.0
adaptive_client_clip: true

attack: none
m_real: 0
ipm_epsilon: 0.1
backdoor_gamma: 20.0
backdoor_trigger_size: 5
backdoor_target_label: 0
backdoor_poison_ratio: 0.5
backdoor_epochs: 10

log_every: 10
save_dir: ./results/mia_cd_n10
