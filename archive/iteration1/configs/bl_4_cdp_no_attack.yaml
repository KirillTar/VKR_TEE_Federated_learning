# BL-4: FedAvg + Central DP, no attacks, epsilon sweep
# Run separately for each epsilon value via --override epsilon=X
name: bl_4_cdp_eps4
dataset: cifar10
data_dir: ./data
alpha: 0.5
seed: 42

n_clients: 20
n_rounds: 200
local_epochs: 5
batch_size: 32
lr: 0.01
momentum: 0.9
weight_decay: 1.0e-4

aggregation: fedavg
m_assumed: 0

use_dp: true
epsilon: 4.0
delta: 1.0e-5
dp_accounting: opacus
sigma: null

attack: none
m_real: 0

log_every: 10
save_dir: ./results/baselines
