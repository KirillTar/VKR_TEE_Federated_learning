# Base config: CIFAR-10 + TinyMNIST (~11.6K params)
# d=11642, SNR=0.217 at ε=10 — DP viable
# n=200, q=0.2, m_real=80 (40%)
name: svhn_base
dataset: svhn
model_name: tiny
data_dir: ./data
alpha: 0.5
seed: 42

n_clients: 200
clients_per_round: 40
n_rounds: 200
local_epochs: 5
batch_size: 32
lr: 0.01
momentum: 0.9
weight_decay: 1.0e-4

aggregation: fedavg
m_assumed: 12
f: 28
trim_beta: 0.1

use_dp: false
epsilon: 10.0
delta: 1.0e-5
dp_accounting: opacus
sigma: null
clip_max: 2.0

attack: none
m_real: 80

backdoor_gamma: 20.0
backdoor_trigger_size: 5
backdoor_target_label: 0
backdoor_poison_ratio: 0.5
backdoor_epochs: 10

log_every: 10
save_dir: ./results/svhn_tiny
