# Fashion-MNIST + MicroMNIST (~4.3K params)
# d=4266, ceiling ~88-89% centralized
# SNR_MK = 28/(σ×65.3), SNR_FA = 40/(σ×65.3)
# At ε=10 (σ=1.707): SNR_MK=0.251, SNR_FA=0.359 — DP viable
name: fmnist_micro_base
dataset: fashion_mnist
model_name: micro
data_dir: ./data
alpha: 0.5
seed: 42

n_clients: 200
clients_per_round: 40
n_rounds: 200
local_epochs: 5
batch_size: 32
lr: 0.01
momentum: 0.9
weight_decay: 1.0e-4

aggregation: fedavg
m_assumed: 12
f: 28
trim_beta: 0.1

use_dp: false
epsilon: 10.0
delta: 1.0e-5
dp_accounting: opacus
sigma: null
clip_max: 2.0

attack: none
m_real: 80

backdoor_gamma: 20.0
backdoor_trigger_size: 5
backdoor_target_label: 0
backdoor_poison_ratio: 0.5
backdoor_epochs: 10

log_every: 10
save_dir: ./results/fmnist_micro
