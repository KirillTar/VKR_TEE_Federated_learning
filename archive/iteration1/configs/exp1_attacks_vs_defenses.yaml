# Exp 1: Main attack × defense matrix
# 4 attacks × 5 defenses × 3 seeds
# Run with --override attack=X aggregation=Y use_dp=Z epsilon=W
#
# Attacks:   label_flip | sign_flip | alie | backdoor
# Defenses:
#   NoDefense:        aggregation=fedavg, use_dp=false
#   MKrum:            aggregation=multi_krum, use_dp=false
#   CDP(eps=4):       aggregation=fedavg, use_dp=true, epsilon=4
#   MKrum+CDP(eps=4): aggregation=multi_krum, use_dp=true, epsilon=4
#   MKrum+CDP(eps=1): aggregation=multi_krum, use_dp=true, epsilon=1

name: exp1_mkrum_cdp_eps4_alie
dataset: cifar10
data_dir: ./data
alpha: 0.5
seed: 42

n_clients: 20
n_rounds: 200
local_epochs: 5
batch_size: 32
lr: 0.01
momentum: 0.9
weight_decay: 1.0e-4

aggregation: multi_krum
m_assumed: 6
f: 14

use_dp: true
epsilon: 4.0
delta: 1.0e-5
dp_accounting: opacus
sigma: null

attack: alie
m_real: 4
flip_source: 5
flip_target: 3

backdoor_gamma: 10.0   # n/2 = 10
backdoor_trigger_size: 5
backdoor_target_label: 0
backdoor_poison_ratio: 0.5
backdoor_epochs: 10

log_every: 10
save_dir: ./results/exp1
