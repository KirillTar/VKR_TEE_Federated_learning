# BL-5: Attacks without defense on Fashion-MNIST with TinyMNIST.
# n=200, q=0.2, m_real=60 (30%). Sweep m_real as needed.
name: bl_5_attack_fmnist
dataset: fashion_mnist
model_name: tiny_mnist
data_dir: ./data
alpha: 0.5
seed: 42

n_clients: 200
clients_per_round: 40
n_rounds: 200
local_epochs: 5
batch_size: 32
lr: 0.01
momentum: 0.9
weight_decay: 1.0e-4

aggregation: fedavg
m_assumed: 0

use_dp: false
epsilon: .inf

attack: random_label_flip
m_real: 60

backdoor_gamma: 20.0
backdoor_trigger_size: 5
backdoor_target_label: 0
backdoor_poison_ratio: 0.5
backdoor_epochs: 10

log_every: 10
save_dir: ./results/baselines_fmnist
