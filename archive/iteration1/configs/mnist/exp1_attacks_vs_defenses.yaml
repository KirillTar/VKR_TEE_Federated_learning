# Exp-1: Attacks × Defenses. Main result table.
# Matrix: 4 attacks × 5 defenses × 3 seeds = 60 runs.
# n=200, q=0.2, m_real=60 (30%), m_assumed=12, f=28.
# Defenses: NoDefense, MKrum, CDP(ε=50), MKrum+CDP(ε=50), MKrum+CDP(ε=10)
# Attacks: random_label_flip, sign_flip, alie(α=0.1), backdoor(γ=20)
# clip_max=2.0 prevents adaptive clipping feedback loop with DP
name: exp1_base_mnist
dataset: mnist
data_dir: ./data
alpha: 0.5
seed: 42

n_clients: 200
clients_per_round: 40
n_rounds: 200
local_epochs: 5
batch_size: 32
lr: 0.01
momentum: 0.9
weight_decay: 1.0e-4

aggregation: fedavg
m_assumed: 12
f: 28

use_dp: false
epsilon: 50.0
delta: 1.0e-5
dp_accounting: opacus
sigma: null
clip_max: 2.0

attack: random_label_flip
m_real: 60

backdoor_gamma: 20.0
backdoor_trigger_size: 5
backdoor_target_label: 0
backdoor_poison_ratio: 0.5
backdoor_epochs: 10

log_every: 10
save_dir: ./results/exp1_mnist
