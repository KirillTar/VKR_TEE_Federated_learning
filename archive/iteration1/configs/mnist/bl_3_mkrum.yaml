# BL-3: FedAvg + Multi-Krum, no attacks. n=200, q=0.2, m_assumed=12, f=28.
# Expected: BL-2 minus 1-3%. FPR = 12/40 = 30% per round (12 clients rejected).
name: bl_3_mkrum_mnist
dataset: mnist
data_dir: ./data
alpha: 0.5
seed: 42

n_clients: 200
clients_per_round: 40
n_rounds: 200
local_epochs: 5
batch_size: 32
lr: 0.01
momentum: 0.9
weight_decay: 1.0e-4

aggregation: multi_krum
m_assumed: 12
f: 28

use_dp: false
epsilon: .inf

attack: none
m_real: 0

log_every: 10
save_dir: ./results/baselines_mnist
