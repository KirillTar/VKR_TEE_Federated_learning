# BL-0: Centralized training on MNIST. Ceiling accuracy.
# n_clients=1: all 60K training samples at one client.
# 10 rounds × 5 epochs = 50 epochs total (sufficient for MNIST convergence to ~98.9%).
name: bl_0_centralized_mnist
dataset: mnist
data_dir: ./data
alpha: 10.0
seed: 42

n_clients: 1
clients_per_round: 1
n_rounds: 10
local_epochs: 5
batch_size: 64
lr: 0.01
momentum: 0.9
weight_decay: 1.0e-4

aggregation: fedavg
m_assumed: 0

use_dp: false
epsilon: .inf

attack: none
m_real: 0

log_every: 2
save_dir: ./results/baselines_mnist
