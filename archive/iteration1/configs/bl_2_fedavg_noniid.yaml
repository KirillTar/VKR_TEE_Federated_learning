# BL-2: FedAvg, alpha=0.5 non-IID, no attacks/defenses (~76-80%)
name: bl_2_fedavg_noniid
dataset: cifar10
data_dir: ./data
alpha: 0.5
seed: 42

n_clients: 20
n_rounds: 200
local_epochs: 5
batch_size: 32
lr: 0.01
momentum: 0.9
weight_decay: 1.0e-4

aggregation: fedavg
m_assumed: 0

use_dp: false
epsilon: .inf

attack: none
m_real: 0

log_every: 10
save_dir: ./results/baselines
