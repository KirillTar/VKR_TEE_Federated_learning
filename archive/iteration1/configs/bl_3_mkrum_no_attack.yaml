# BL-3: FedAvg + Multi-Krum, no attacks (verify Krum doesn't break clean accuracy)
# Expected: MTA ≈ BL-2 minus 1-3%, FPR = 6/20 = 30%
name: bl_3_mkrum_no_attack
dataset: cifar10
data_dir: ./data
alpha: 0.5
seed: 42

n_clients: 20
n_rounds: 200
local_epochs: 5
batch_size: 32
lr: 0.01
momentum: 0.9
weight_decay: 1.0e-4

aggregation: multi_krum
m_assumed: 6
f: 14

use_dp: false
epsilon: .inf

attack: none
m_real: 0

log_every: 10
save_dir: ./results/baselines
