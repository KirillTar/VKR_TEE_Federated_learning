# BL-0: Centralized training (upper bound ~86-88%)
name: bl_0_centralized
dataset: cifar10
data_dir: ./data
alpha: 10.0
seed: 42

n_clients: 1
n_rounds: 50
local_epochs: 10
batch_size: 128
lr: 0.01
momentum: 0.9
weight_decay: 1.0e-4

aggregation: fedavg
m_assumed: 0

use_dp: false
epsilon: .inf

attack: none
m_real: 0

log_every: 5
save_dir: ./results/baselines
