# BL-4 CD: FedRoLA + DP ε=10, no attack
name: cd_bl4_fedrola_dp
dataset: fashion_mnist
model_name: micro
data_dir: ./data
alpha: 0.5

n_clients: 200
clients_per_round: 40
n_rounds: 200
local_epochs: 5
batch_size: 32
lr: 0.01
momentum: 0.9
weight_decay: 1.0e-4

aggregation: fedrola
fedrola_chi: 0.1
m_assumed: 12

use_dp: true
dp_level: client
epsilon: 10.0
delta: 1.0e-5
clip_max: 2.0
adaptive_client_clip: true

attack: none
m_real: 0

log_every: 10
save_dir: ./results/cross_device
