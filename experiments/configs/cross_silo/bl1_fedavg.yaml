# BL-1 CS: FedAvg, no DP, no attack
name: cs_bl1_fedavg
dataset: svhn
model_name: svhn_cnn
data_dir: ./data
alpha: 0.5

n_clients: 50
clients_per_round: 40
n_rounds: 200
local_epochs: 1
batch_size: 32
lr: 0.01
momentum: 0.9
weight_decay: 1.0e-4

aggregation: fedavg
m_assumed: 12

use_dp: false
epsilon: 10000.0
delta: 1.0e-5
clip_max: 2.0
adaptive_client_clip: true

attack: none
m_real: 0

log_every: 10
save_dir: ./results/cross_silo
